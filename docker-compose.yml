services:
  # .NET API + SQLite（單人使用，不另外開資料庫容器）。資料在具名 volume。
  api:
    build:
      context: ./backend
      dockerfile: DayCap.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Path: /app/data/daycap.db
      # 必須跟 Mini-SSO 的 .env 完全一致，才能驗證它簽的 JWT
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      TZ: Asia/Taipei
    volumes:
      - daycap-data:/app/data
    # 不對外開 port，只給同一個 compose 裡的 web(nginx) 轉發
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    # 只綁 127.0.0.1，對外一律走 Cloudflare Tunnel（daycap.matthewyu.uk → localhost:12120）
    ports:
      - "127.0.0.1:${WEB_PORT:-12120}:80"
    # 登入相關的 /api/auth 轉給主機上的 Mini-SSO（localhost:12080）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  daycap-data:
