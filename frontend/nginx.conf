# Cloudflare Tunnel 在邊緣終止 TLS，用 HTTP 轉進來，但會帶 X-Forwarded-Proto。
# 有就用它；沒有（本機直連）才用這條連線自己的 scheme。
map $http_x_forwarded_proto $effective_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Mini-SSO 跑在主機上，走 host-gateway（寫在容器 /etc/hosts，IP 固定），
# 所以用啟動時解析的 upstream。Docker 內建 DNS 查不到 /etc/hosts 裡的名字。
upstream mini_sso {
    server host.docker.internal:12080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # api 容器單獨重建後 IP 會變：用 Docker 內建 DNS + 變數，每次請求重新解析，避免 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_scheme;

    # 個人專用：不開放從這個站註冊新帳號（帳號在 Mini-SSO 建好就好）。
    location = /api/auth/create {
        default_type application/json;
        return 403 '{"title":"Registration is disabled on this site."}';
    }

    # ---- Mini-SSO（同網域轉發，瀏覽器不用處理 CORS）----
    location = /api/auth {
        proxy_pass http://mini_sso;
    }
    location /api/auth/ {
        proxy_pass http://mini_sso;
    }
    # Mini-SSO 自己的轉址會用大寫 /api/Auth/...
    location ~ ^/api/Auth/ {
        proxy_pass http://mini_sso;
    }
    location = /signin-google {
        proxy_pass http://mini_sso;
    }
    location = /signin-github {
        proxy_pass http://mini_sso;
    }

    # ---- DayCap API ----
    location /api/ {
        proxy_pass $api_upstream$request_uri;
    }
    location = /healthz {
        proxy_pass $api_upstream/healthz;
    }

    # ---- 靜態檔 ----
    # 帶 hash 的 build 產物可以永久快取
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # index.html / manifest 每次都要重新驗證，更新才會馬上生效（PWA 加到主畫面後尤其重要）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
